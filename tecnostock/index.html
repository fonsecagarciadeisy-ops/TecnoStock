<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TecnoStock</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>TecnoStock</h1>
    <p>Unidades en el carrito: <strong id="unidades">0</strong><a href="#seccion-carrito">Ver carrito</a><p>
  </header>
  <main>
    <section aria-labelledby="t-buscar">
      <h2 id="t-buscar">Buscar y filtrar</h2>
      <form id="filtros">
        <label for="buscar">Buscar</label>
        <input id="buscar" type="search">
        <label for="categoria">Categoría</label>
        <select id="categoria"><option value="">Todas</option></select>
        <label for="orden">Ordenar por precio</label>
        <select id="orden">
          <option value="">Sin orden</option>
          <option value="asc">Menor a mayor</option>
          <option value="desc">Mayor a menor</option>
        </select>
        <label><input id="soloDisponibles" type="checkbox"> Solo disponibles</label>
        <button id="limpiarFiltros" type="button">Limpiar filtros</button>
      </form>
    </section>
    <section aria-labelledby="t-catalogo">
      <h2 id="t-catalogo">Catálogo</h2>
      <p id="estado" role="status"></p>
      <p id="vacio" hidden>No se encontraron productos.</p>
      <product-list id="lista"></product-list>
    </section>
    <section id="seccion-carrito" aria-labelledby="t-carrito">
      <h2 id="t-carrito">Carrito</h2>
      <p id="mensaje" role="status"></p>
      <shopping-cart id="carrito"></shopping-cart>
      <button id="vaciar" type="button">Vaciar carrito</button>
    </section>
    <section aria-labelledby="t-resumen">
      <h2 id="t-resumen">Resumen del pedido</h2>
      <dl>
        <dt>Subtotal</dt><dd id="subtotal"></dd>
        <dt>Descuento (10 % desde $300.000)</dt><dd id="descuento"></dd>
        <dt>Total</dt><dd id="total"></dd>
      </dl>
      <button id="confirmar" type="button">Confirmar pedido</button>
      <div id="confirmacion" role="status"></div>
    </section>
  </main>
</body>
</html>
